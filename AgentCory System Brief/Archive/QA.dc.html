<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>QA matrix · AIUXAleem</title>
  <script>(function(){var d=document.documentElement,q=new URLSearchParams(location.search),t=q.get('theme')||'light';d.setAttribute('data-theme',t==='dark'?'dark':'light');d.lang='en';d.dir='ltr';d.setAttribute('data-langs','en');d.setAttribute('data-page','qa');d.setAttribute('data-qa','')})();</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Kufi+Arabic:wght@700;800&amp;display=swap">
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
  <script src="i18n.js"></script>
  <script src="cases.js"></script>
</helmet>
<main style="display:grid; gap:var(--space-6); padding:var(--space-6) var(--gutter); max-inline-size:var(--container-wide); margin-inline:auto;">
  <header style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-4); flex-wrap:wrap;">
    <div style="display:grid; gap:var(--space-1);">
      <p class="cory-overline" style="margin:0;">Internal · noindex</p>
      <h1 style="margin:0; font-size:var(--text-h2); color:var(--text-strong);">Component matrix: LTR/RTL × light/dark</h1>
      <p style="margin:0; font-size:var(--text-body-sm); color:var(--text-muted);">Each cell is a scoped container with its own data-theme, dir and lang. Nothing in a component branches on either.</p>
    </div>
    <x-import component-from-global-scope="DesignSystem_ebeb85.Toggle" style="white-space:nowrap;" label="Stress strings" checked="{{ stress }}" onChange="{{ toggleStress }}" hint-size="auto,44px"></x-import>
  </header>
  <div class="cory-cards" style="--card-min:560px; align-items:start;">
    <dc-import name="QA Cell" theme="light" dir="ltr" lang="en" stress="{{ stress }}" hint-size="100%,2600px"></dc-import>
    <dc-import name="QA Cell" theme="dark" dir="ltr" lang="en" stress="{{ stress }}" hint-size="100%,2600px"></dc-import>
    <dc-import name="QA Cell" theme="light" dir="rtl" lang="ar" stress="{{ stress }}" hint-size="100%,2600px"></dc-import>
    <dc-import name="QA Cell" theme="dark" dir="rtl" lang="ar" stress="{{ stress }}" hint-size="100%,2600px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { stress: (() => { try { return new URLSearchParams(location.search).get('stress') === '1'; } catch (e) { return false; } })() };
  renderVals() { return { stress: this.state.stress, toggleStress: e => this.setState({ stress: e && e.target ? !!e.target.checked : !this.state.stress }) }; }
}
</script>
</body>
</html>
