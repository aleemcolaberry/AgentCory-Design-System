<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
</helmet>
<div data-cq>
  <x-import component-from-global-scope="DesignSystem_ebeb85.Card" variant="outline" padding="md" href="{{ href }}" interactive="{{ true }}" hint-size="100%,140px">
    <div data-cq-pad style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-3) var(--space-4); flex-wrap:wrap;">
      <div style="display:grid; gap:var(--space-1);">
        <span class="cory-overline">{{ overline }}</span>
        <strong style="font-size:var(--text-h4); color:var(--text-strong);">{{ title }}</strong>
        <span style="font-size:var(--text-body-sm); line-height:var(--leading-normal); color:var(--text-muted); max-inline-size:var(--measure-lead);">{{ body }}</span>
      </div>
      <span style="display:inline-flex; align-items:center; gap:var(--space-1); min-block-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-link); overflow-wrap:normal;">{{ link }}<svg data-dir-icon width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:160},&quot;overline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Need this for your product?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Design System Build&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tokens, accessible components and spec files.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;link&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;See the service&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Services.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { return { overline: this.props.overline, title: this.props.title, body: this.props.body, link: this.props.link, href: this.props.href || '#' }; }
}
</script>
</body>
</html>
