<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>QA sweep · AIUXAleem</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
  <link rel="stylesheet" href="../shared/site.css">
</helmet>
<main style="padding:var(--space-4); display:grid; gap:var(--space-3); font-family:var(--font-mono); font-size:var(--text-mono-sm); color:var(--text-body);">
  <p style="margin:0; font-weight:var(--weight-bold); color:var(--text-strong);">{{ status }}</p>
  <table style="border-collapse:collapse; table-layout:auto; inline-size:auto;">
    <thead><tr><th style="text-align:start; padding:var(--space-1) var(--space-2);">page · state</th><sc-for list="{{ cols }}" as="w" hint-placeholder-count="14"><th style="padding:var(--space-1) var(--space-2);">{{ w }}</th></sc-for></tr></thead>
    <tbody><sc-for list="{{ rows }}" as="r" hint-placeholder-count="20"><tr><td style="padding:var(--space-1) var(--space-2); white-space:nowrap;">{{ r.label }}</td><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="14"><td style="padding:var(--space-1) var(--space-2); text-align:center; color:{{ c.color }};">{{ c.mark }}</td></sc-for></tr></sc-for></tbody>
  </table>
  <pre style="margin:0; white-space:pre-wrap; font-size:var(--text-mono-sm);">{{ details }}</pre>
  <div data-frames style="position:fixed; inset-block-start:0; inset-inline-start:0; opacity:0; pointer-events:none;"></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>

    [['Work.dc.html', 'work'], ['Services.dc.html', 'services'], ['About.dc.html', 'about'], ['Content.dc.html', 'content'], ['Guides.dc.html', 'guides'], ['Guide.dc.html', 'guide']]

  componentWillUnmount() { clearInterval(this.iv); this.host && this.host.remove(); }

    const q = new URLSearchParams({ qa: '1', theme: job.theme }); if (job.lang === 'ar') q.set('lang', 'ar'); if (job.stress) q.set('stress', '1');

    const started = Date.now();
    const poll = () => {
      let doc; try { doc = f.contentDocument; } catch (e) { return finish({ err: 'cross-origin' }); }
      const ready = doc && doc.querySelector('[data-site-footer]') && doc.querySelector('main') && (!doc.fonts || doc.fonts.status === 'loaded');
      if (!ready) { if (Date.now() - started > 25000) return finish({ err: 'timeout' }); return setTimeout(poll, 300); }

    };
    this.host.appendChild(f);
    setTimeout(poll, 1000);
  }
  mount(job) {
    const land = typeof job.w === 'string'; const W = land ? 740 : job.w, H = land ? 360 : 900;
    const f = document.createElement('iframe');
    f.style.cssText = 'inline-size:' + W + 'px; max-inline-size:none; block-size:' + H + 'px; border:0; display:block;';
    const q = new URLSearchParams({ qa: '1', theme: job.theme }); if (job.lang === 'ar') q.set('lang', 'ar'); if (job.stress) q.set('stress', '1');

  }
  tryMeasure(x) {
    const key = x.job.short + '|' + x.job.label + '|' + x.job.w;
    const done = r => { this.setState(s => ({ res: { ...s.res, [key]: r }, done: s.done + 1 })); x.f.remove(); return true; };
    let doc; try { doc = x.f.contentDocument; } catch (e) { return done({ err: 'cross-origin' }); }

  measure(f, job, W) {
