<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;home&quot;,&quot;work&quot;,&quot;content&quot;,&quot;guides&quot;,&quot;services&quot;,&quot;about&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;embedded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ar&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = Component.read();
  static read() {
    const d = document.documentElement;
    return { theme: d.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', lang: d.lang === 'ar' ? 'ar' : 'en', menuOpen: false };
  }
  async componentDidMount() {
    this.site = await import('../shared/site.js');
    const ok = await this.site.waitFor(() => window.AIUX_COPY && window.AIUX_I18N);
    if (!ok && !this.props.embedded) this.setState({ copyFailed: true }); else this.forceUpdate();
    if (this.props.embedded) return;
    this.setState(Component.read());
    this.site.headerScroll();
    this.unobserve = this.site.observeRoot(['data-theme', 'lang'], () => this.setState(Component.read()));
    this.mq = matchMedia('(prefers-color-scheme: dark)');
    this.onScheme = e => { let s = null; try { s = localStorage.getItem(this.site.THEME_KEY); } catch (err) {} if (!s) this.site.setTheme(e.matches ? 'dark' : 'light'); };
    this.mq.addEventListener('change', this.onScheme);
    this.onKey = e => {
      if (!this.state.menuOpen) return;
      if (e.key === 'Escape') { this.closeMenu(); return; }
      if (e.key !== 'Tab') return;   // keep Tab inside the modal menu
      const d = document.querySelector('[data-menu]'); if (!d) return;
      const f = [...d.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null); if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === d)) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    this.unobserve && this.unobserve();
    this.mq && this.mq.removeEventListener('change', this.onScheme);
    document.removeEventListener('keydown', this.onKey);
    document.documentElement.style.overflow = '';
  }
  view() { return this.props.embedded ? { theme: this.props.theme === 'dark' ? 'dark' : 'light', lang: this.props.lang === 'ar' ? 'ar' : 'en' } : this.state; }
  toggleTheme = e => { if (this.props.embedded || !this.site) return; this.site.setTheme(this.state.theme === 'dark' ? 'light' : 'dark', e.currentTarget); };
  toggleLang = () => { if (this.props.embedded || !this.site) return; if (this.state.menuOpen) this.closeMenu(); this.site.setLang(this.state.lang === 'ar' ? 'en' : 'ar'); };
  onHome() { return document.documentElement.getAttribute('data-page') === 'home'; }
  navClick = e => {
    if (this.props.embedded) { e.preventDefault(); return; }
    const href = e.currentTarget.getAttribute('href') || ''; const i = href.indexOf('#');
    if (i < 0 || !this.onHome() || !this.site) return;
    const target = href.slice(i);
    if (!document.querySelector(target)) return;
    e.preventDefault(); if (this.state.menuOpen) this.closeMenu();
    this.site.scrollToId(target);
  };
  talk = e => {
    if (this.props.embedded) { e.preventDefault(); return; }
    if (this.state.menuOpen) this.closeMenu();
    const here = document.querySelector('[data-contact], #contact');
    if (this.site && here) { e.preventDefault(); if (!here.id) here.id = 'contact'; this.site.scrollToId('#' + here.id); }
  };
  skip = e => { if (this.site && this.site.scrollToId('#main')) e.preventDefault(); };
  openMenu = () => { if (this.props.embedded) return; this.opener = document.activeElement; document.documentElement.style.overflow = 'hidden'; this.setState({ menuOpen: true }, () => this.focusMenu()); };
  // The close button mounts asynchronously: retry for ~600ms, then fall back to the dialog itself so focus is never left behind the overlay
  // Focus lands on the dialog at once (never left behind the overlay), then moves to Close as soon as that button mounts
  focusMenu = () => { if (!this.state.menuOpen) return; const d = document.querySelector('[data-menu]'); if (!d) return; const pick = () => { const c = d.querySelector('[data-menu-close-wrap] button'); if (c) { c.focus(); this.menuMo && this.menuMo.disconnect(); return true; } return false; }; d.focus(); if (pick()) return; this.menuMo = new MutationObserver(pick); this.menuMo.observe(d, { childList: true, subtree: true }); setTimeout(() => this.menuMo && this.menuMo.disconnect(), 3000); };
  closeMenu = () => { this.menuMo && this.menuMo.disconnect(); document.documentElement.style.overflow = ''; this.setState({ menuOpen: false }, () => { this.opener && this.opener.focus && this.opener.focus(); }); };
  renderVals() {
    const v = this.view(); const isDark = v.theme === 'dark';
    const all = window.AIUX_I18N || {}; const c = (all[v.lang] || all.en || {}).chrome || {};
    const langs = (document.documentElement.getAttribute('data-langs') || 'en').split(' ');
    const other = v.lang === 'ar' ? 'en' : 'ar'; const fallback = !this.props.embedded && !langs.includes(other);
    const cur = this.props.current || '';
    const nav = (c.nav || []).map(n => ({ ...n, current: cur === n.key ? 'page' : undefined }));
    return {
      c, nav, isDark, isLight: !isDark,
      // Copy scripts failed to load: the page shell would render blank. Hard-coded bilingual message because the copy itself is what is missing.
      copyFailed: !!this.state.copyFailed, reload: () => location.reload(),
      failMsg: v.lang === 'ar' ? 'لم يتم تحميل بعض نصوص الصفحة. تحقّق من اتصالك ثم أعد التحميل.' : "Some of this page's text didn't load. Check your connection, then reload.",
      reloadLabel: v.lang === 'ar' ? 'إعادة التحميل' : 'Reload', notEmbedded: !this.props.embedded, fixed: this.props.embedded ? 'false' : 'true', position: this.props.embedded ? 'relative' : 'fixed',
      themeAria: isDark ? c.toLight : c.toDark, themeTip: isDark ? c.themeTipLight : c.themeTipDark,
      langAria: fallback ? c.langAriaFallback : c.langAria, langHint: ' (' + (fallback ? c.langAriaFallback : c.langAria) + ')', langTip: fallback ? c.langTipFallback : c.langTip, langFallback: fallback,
      homeHref: v.lang === 'ar' ? 'AIUXAleem Home.dc.html?lang=ar' : 'AIUXAleem Home.dc.html',
      talkHref: v.lang === 'ar' ? 'AIUXAleem Home.dc.html?lang=ar#contact' : 'AIUXAleem Home.dc.html#contact',
      toggleTheme: this.toggleTheme, toggleLang: this.toggleLang, navClick: this.navClick, talk: this.talk, skip: this.skip,
      menuOpen: this.state.menuOpen, openMenu: this.openMenu, closeMenu: this.closeMenu,
    };
  }
}
</script>
