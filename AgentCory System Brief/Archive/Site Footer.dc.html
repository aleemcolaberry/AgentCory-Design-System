<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
  <script src="i18n.js"></script>
</helmet>
<footer data-site-footer data-shared style="position:relative; z-index:var(--z-raised); background:var(--gradient-ink); color:var(--on-ink-body); border-block-start:1px solid var(--on-ink-border);">
  <div class="cory-container" style="padding-block:var(--space-12) var(--space-8); display:grid; gap:var(--space-8);">
    <sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}"><div style="display:flex; justify-content:space-between; align-items:center; gap:var(--space-6); flex-wrap:wrap; padding-block-end:var(--space-8); border-block-end:1px solid var(--on-ink-border);">
      <div style="display:grid; gap:var(--space-2); max-inline-size:var(--measure-lead);">
        <p class="cory-overline" style="margin:0; color:var(--on-ink-link);">{{ f.overline }}</p>
        <p style="margin:0; font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-h2); line-height:var(--leading-heading); letter-spacing:var(--tracking-tight); color:var(--on-ink-strong); text-wrap:balance;">{{ f.title }}</p>
      </div>
      <div data-cta-row style="display:flex; gap:var(--space-3); flex-wrap:wrap; align-items:center;">
        <x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="onInkSolid" size="md" href="https://cal.com/md-abdul-aleem-gilsy7/15min?overlayCalendar=true" target="_blank" rel="noopener" hint-size="auto,44px">{{ f.call }}</x-import>
        <x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="onInk" size="md" href="https://drive.google.com/file/d/1cmkjeMQc1S9gIePpRh29T4nFkBBe3izm/view" target="_blank" rel="noopener" hint-size="auto,44px">{{ f.resume }}</x-import>
      </div>
    </div></sc-if>
    <div style="display:flex; justify-content:space-between; gap:var(--space-8); flex-wrap:wrap;">
      <div style="display:grid; gap:var(--space-3); max-inline-size:var(--measure-lead);">
        <a href="{{ homeHref }}" style="display:inline-flex; align-items:center; gap:var(--space-2); inline-size:fit-content; min-block-size:var(--tap-target); font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-h4); color:var(--on-ink-strong); text-decoration:none;"><span aria-hidden="true" style="inline-size:var(--space-5); block-size:var(--space-5); border-radius:var(--radius-tile); background:var(--gradient-brand);"></span><span lang="en" dir="ltr" style="white-space:nowrap;">AIUXAleem</span></a>
        <p style="margin:0; font-size:var(--text-body-sm); line-height:var(--leading-relaxed); color:var(--on-ink-body);">{{ f.bio }}</p>
      </div>
      <nav aria-label="{{ f.navAria }}">
        <ul style="display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-5);">
          <sc-for list="{{ nav }}" as="n" hint-placeholder-count="5"><li><a href="{{ n.href }}" style="display:inline-flex; align-items:center; min-block-size:var(--tap-target); min-inline-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-medium); color:var(--on-ink-body); text-decoration:none;" style-hover="color:var(--on-ink-strong);">{{ n.label }}</a></li></sc-for>
        </ul>
      </nav>
    </div>
    <div data-reveal-clip aria-hidden="true" style="overflow:clip; margin-block-start:var(--space-4);"><span lang="en" dir="ltr" style="display:block; font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-mega); line-height:var(--leading-display); letter-spacing:var(--tracking-tighter); color:var(--on-ink-strong); white-space:nowrap; user-select:none;">AIUXAleem</span></div>
    <div style="display:flex; justify-content:space-between; gap:var(--space-3) var(--space-6); flex-wrap:wrap; padding-block-start:var(--space-5); border-block-start:1px solid var(--on-ink-border); font-size:var(--text-caption); color:var(--on-ink-muted);">
      <span>{{ f.rights }}</span>
      <span style="display:inline-flex; gap:var(--space-4); flex-wrap:wrap; align-items:center;"><span style="color:var(--on-ink-body); font-size:var(--text-body-sm);"><dc-import name="Email Copy" copy-label="{{ c.copyEmail }}" copied-label="{{ c.copied }}" fallback-label="{{ c.pressCopy }}" hint-size="auto,44px"></dc-import></span><a href="https://www.linkedin.com/in/aiuxaleem" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; min-block-size:var(--tap-target); color:var(--on-ink-body); text-decoration:none;" style-hover="color:var(--on-ink-strong);">{{ f.linkedin }}</a><a href="https://www.youtube.com/@aiuxaleem" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; min-block-size:var(--tap-target); color:var(--on-ink-body); text-decoration:none;" style-hover="color:var(--on-ink-strong);">{{ f.youtube }}</a></span>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:360},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;en&quot;,&quot;ar&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;stress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hideCta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { lang: document.documentElement.lang === 'ar' ? 'ar' : 'en' };
  async componentDidMount() {
    const site = await import('../shared/site.js');
    await site.waitFor(() => window.AIUX_COPY); this.forceUpdate();
    if (this.props.lang) return;
    this.unobserve = site.observeRoot(['lang'], () => this.setState({ lang: document.documentElement.lang === 'ar' ? 'ar' : 'en' }));
  }
  componentWillUnmount() { this.unobserve && this.unobserve(); }
  renderVals() {
    const lang = this.props.lang || this.state.lang;
    const d = window.AIUX_COPY ? window.AIUX_COPY(lang, !!this.props.stress) : null;
    const c = (d && d.chrome) || {};
    return { c, f: c.footer || {}, nav: c.nav || [], showCta: !this.props.hideCta, homeHref: lang === 'ar' ? 'AIUXAleem Home.dc.html?lang=ar' : 'AIUXAleem Home.dc.html' };
  }
}
</script>
</body>
</html>
