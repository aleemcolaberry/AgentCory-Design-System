<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
</helmet>
<div data-cq style="block-size:100%;">
  <x-import component-from-global-scope="DesignSystem_ebeb85.Card" padding="md" style="block-size:100%;" hint-size="100%,160px">
    <div data-cq-pad style="display:grid; gap:var(--space-2);">
      <sc-if value="{{ accent }}" hint-placeholder-val="{{ true }}"><bdi data-metric class="cory-metric" style="display:inline-block; background:var(--gradient-text); -webkit-background-clip:text; background-clip:text; color:transparent; font-variant-numeric:tabular-nums;">{{ value }}</bdi></sc-if>
      <sc-if value="{{ plain }}" hint-placeholder-val="{{ false }}"><bdi data-metric class="cory-metric" style="display:inline-block; font-variant-numeric:tabular-nums;">{{ value }}</bdi></sc-if>
      <span style="font-size:var(--text-body-sm); font-weight:var(--weight-semibold); line-height:var(--leading-normal); color:var(--text-body);">{{ label }}</span>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:180},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;245&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;design tokens&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { const a = !!this.props.accent; return { accent: a, plain: !a, value: this.props.value, label: this.props.label }; }
}
</script>
</body>
</html>
