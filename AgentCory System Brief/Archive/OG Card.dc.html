<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <title>OG card · AIUXAleem (export asset)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
  <link rel="stylesheet" href="../shared/site.css">
</helmet>
<div id="og-card" data-og style="position:relative; width:1200px; height:630px; overflow:hidden; background:var(--gradient-ink); color:var(--on-ink-body); font-family:var(--font-sans); display:flex; flex-direction:column; justify-content:space-between; padding:72px 80px; box-sizing:border-box;">
  <div aria-hidden="true" style="position:absolute; inset-block-start:-30%; inset-inline-end:-12%; width:720px; aspect-ratio:1; border-radius:999px; background:var(--glow-cyan-strong); pointer-events:none;"></div>
  <div aria-hidden="true" style="position:absolute; inset-block-end:-45%; inset-inline-start:-10%; width:620px; aspect-ratio:1; border-radius:999px; background:var(--glow-blue); pointer-events:none;"></div>
  <div style="position:relative; display:flex; align-items:center; gap:14px;">
    <span aria-hidden="true" style="width:36px; height:36px; border-radius:22.7%; background:var(--gradient-brand); flex-shrink:0;"></span>
    <span lang="en" dir="ltr" style="font-family:var(--font-display); font-weight:800; font-size:30px; letter-spacing:-0.018em; color:var(--on-ink-strong); white-space:nowrap; overflow-wrap:normal;">AIUXAleem</span>
  </div>
  <div style="position:relative; display:grid; gap:28px;">
    <p style="margin:0; max-width:19ch; font-family:var(--font-display); font-weight:800; font-size:84px; line-height:1.08; letter-spacing:-0.03em; color:var(--on-ink-strong); text-wrap:balance;">I design AI products people actually <span style="background:var(--gradient-brand); -webkit-background-clip:text; background-clip:text; color:transparent;">trust</span>.</p>
    <p style="margin:0; font-size:28px; line-height:1.4; color:var(--on-ink-body); max-width:48ch; overflow-wrap:normal;">Mohammad Abdul Aleem · AI-first Senior Product Designer · 13+ yrs enterprise UX, design systems, AI</p>
  </div>
  <div style="position:relative; display:flex; justify-content:space-between; align-items:center; gap:24px; font-family:var(--font-mono); font-size:22px; color:var(--on-ink-muted); white-space:nowrap; overflow-wrap:normal;">
    <span style="white-space:nowrap; overflow-wrap:normal; font-family:var(--font-mono);">aiuxaleem.com</span>
    <span style="white-space:nowrap; overflow-wrap:normal;">Hyderabad · GCC hours · KSA / UAE / remote</span>
  </div>
</div>
</x-dc>
</body>
</html>
