<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
</helmet>
<div data-card-fill data-cq data-case-card style="block-size:100%;">
  <x-import component-from-global-scope="DesignSystem_ebeb85.Card" href="{{ copy.href }}" hreflang="{{ copy.hreflang }}" padding="sm" interactive="{{ true }}" style="block-size:100%;" hint-size="100%,420px">
    <div data-case-grid style="display:grid; grid-template-columns:minmax(0, 1fr); gap:var(--space-4); align-items:center;">
      <div style="position:relative; aspect-ratio:var(--aspect-case); border-radius:var(--radius-lg); overflow:hidden; background:var(--surface-sunken);">
        <div data-cover-fallback aria-hidden="true"><bdi>{{ copy.index }}</bdi></div>
        <div data-work-cover style="position:absolute; inset-block:0; inset-inline:-7%;"><sc-if value="{{ hasCover }}" hint-placeholder-val="{{ false }}"><image-slot id="{{ copy.coverId }}" shape="rect" src="{{ copy.cover }}" placeholder="{{ copy.coverLabel }}"></image-slot></sc-if></div>
      </div>
      <div data-cq-pad style="display:flex; flex-direction:column; gap:var(--space-3); block-size:100%; padding:var(--space-2);">
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:var(--space-2) var(--space-3); flex-wrap:wrap; font-size:var(--text-caption); font-weight:var(--weight-semibold); color:var(--text-subtle);"><span style="flex:1 1 16ch;">{{ copy.role }}</span><span style="flex:0 0 auto; white-space:nowrap; font-family:var(--font-mono); font-weight:var(--weight-medium); font-variant-numeric:tabular-nums;">{{ copy.year }}</span></div>
        <div role="heading" aria-level="{{ level }}" style="font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-h2); line-height:var(--leading-heading); letter-spacing:var(--tracking-tight); color:var(--text-strong); text-wrap:balance;">{{ copy.title }}</div>
        <p style="margin:0; font-size:var(--text-body); line-height:var(--leading-normal); color:var(--text-body); max-inline-size:var(--measure-body);">{{ copy.outcome }}</p>
        <span style="margin-block-start:auto; display:inline-flex; align-items:center; gap:var(--space-1); min-block-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-link);">{{ copy.link }}<svg data-dir-icon width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span>
      </div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:480},&quot;copy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{index,title,role,year,outcome,link,href,hreflang,coverId,coverLabel}&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() { const copy = this.props.copy || {}; return { copy, hasCover: !!copy.coverId, level: this.props.level || 3 }; }
}
</script>
</body>
</html>
