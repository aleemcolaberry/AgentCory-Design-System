<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
</helmet>
<nav aria-label="{{ label }}" style="border-block:1px solid var(--border-subtle); background:var(--surface-card);">
  <div class="cory-container" style="min-block-size:var(--space-16); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--space-2) var(--space-4); padding-block:var(--space-2);">
    <ul style="display:flex; gap:var(--space-2); align-items:center; flex-wrap:wrap;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4"><li><a data-toc href="{{ it.href }}" onClick="{{ go }}" style="display:inline-flex; align-items:center; gap:var(--space-2); min-block-size:var(--tap-target); padding:var(--space-1) var(--space-4); border-radius:var(--radius-pill); border:1px solid transparent; font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-muted); text-decoration:none; transition:color var(--duration-base) var(--ease-out), background var(--duration-base) var(--ease-out);" style-hover="color:var(--text-strong); background:var(--surface-sunken);"><bdi style="font-family:var(--font-mono); font-size:var(--text-overline);">{{ it.num }}</bdi><span style="overflow-wrap:normal;">{{ it.label }}</span></a></li></sc-for>
    </ul>
    <x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="ink" size="md" href="{{ ctaHref }}" target="_blank" rel="noopener" hint-size="auto,44px">{{ cta }}</x-import>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:72},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{num,label,href}[]&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;On this page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Book a 15-min call&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ctaHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://cal.com/md-abdul-aleem-gilsy7/15min?overlayCalendar=true&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;inert&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  go = e => { const href = e.currentTarget.getAttribute('href'); if (!href || href[0] !== '#' || this.props.inert) { if (this.props.inert) e.preventDefault(); return; } const el = document.querySelector(href); if (!el) return; e.preventDefault(); import('../shared/site.js').then(s => s.scrollToId(href)); try { history.replaceState(null, '', href); } catch (err) {} };
  componentDidMount() {
    if (this.props.inert) return;
    import('../shared/site.js').then(site => site.waitFor(() => window.ScrollTrigger, 600).then(() => {
      (this.props.items || []).forEach(it => { const el = document.querySelector(it.href); if (!el) return;
        window.ScrollTrigger.create({ trigger: el, start: 'top 45%', end: 'bottom 45%', onToggle: self => { if (!self.isActive) return; document.querySelectorAll('[data-toc]').forEach(a => a.getAttribute('href') === it.href ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')); } }); });
    }));
  }
  renderVals() { return { items: this.props.items || [], label: this.props.label || 'On this page', cta: this.props.cta, ctaHref: this.props.ctaHref || 'https://cal.com/md-abdul-aleem-gilsy7/15min?overlayCalendar=true', go: this.go }; }
}
</script>
</body>
</html>
