<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
</helmet>
<span style="display:inline-flex; align-items:center; gap:var(--space-1); flex-wrap:wrap; color:inherit;">
  <a data-email data-link href="{{ href }}" lang="en" dir="ltr" style="display:inline-flex; align-items:center; min-block-size:var(--tap-target); font-weight:var(--weight-semibold); color:inherit; text-decoration:none; white-space:nowrap; max-inline-size:100%;">{{ email }}</a>
  <button type="button" onClick="{{ copy }}" aria-label="{{ copyLabel }}" title="{{ copyLabel }}" style="display:inline-grid; place-items:center; inline-size:var(--tap-target); block-size:var(--tap-target); border:0; border-radius:var(--radius-pill); background:transparent; color:inherit; cursor:pointer; transition:background var(--duration-base) var(--ease-out), transform var(--duration-fast) var(--ease-out);" style-hover="background:color-mix(in srgb, currentColor 12%, transparent);" style-active="transform:scale(var(--press-scale));">
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg></sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
  </button>
  <span role="status" aria-live="polite" style="font-size:var(--text-caption); color:inherit; opacity:var(--opacity-muted);">{{ status }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:80},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hello@aiuxaleem.com&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subject&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;copyLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Copy email address&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;copiedLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Copied&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fallbackLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Selected. Press Ctrl+C or Cmd+C to copy.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { status: '', done: false };
  componentWillUnmount() { clearTimeout(this.t); }
  copy = async e => {
    const email = this.email(); const a = e.currentTarget.parentElement.querySelector('[data-email]');
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(email); ok = true; } } catch (err) {}
    if (!ok) {
      try { const ta = document.createElement('textarea'); ta.value = email; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;inset-inline-start:-9999px;'; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (err) {}
    }
    if (!ok && a) { try { const r = document.createRange(); r.selectNodeContents(a); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (err) {} }
    this.setState({ done: ok, status: ok ? (this.props.copiedLabel || 'Copied') : (this.props.fallbackLabel || 'Selected. Press Ctrl+C or Cmd+C to copy.') });
    clearTimeout(this.t); this.t = setTimeout(() => this.setState({ done: false, status: '' }), ok ? 2200 : 5000);
  };
  email() { return this.props.email || 'hello@aiuxaleem.com'; }
  renderVals() {
    const email = this.email(); const subj = this.props.subject ? '?subject=' + encodeURIComponent(this.props.subject) : '';
    return { email, href: 'mailto:' + email + subj, copy: this.copy, copyLabel: this.props.copyLabel || 'Copy email address', status: this.state.status, idle: !this.state.done, done: this.state.done };
  }
}
</script>
</body>
</html>
