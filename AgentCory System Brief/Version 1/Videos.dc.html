<dc-import name="Header" current="videos" hint-size="100%,72px"></dc-import>
<main id="main" tabindex="-1" style="position:relative; z-index:var(--z-raised); outline:none;">
  <section aria-labelledby="vd-title" style="position:relative; overflow:clip; padding-block:var(--section-y) var(--space-10);">
    <div aria-hidden="true" class="cory-glow-drift" style="position:absolute; inset-block-start:-30%; inset-inline-end:-10%; inline-size:min(60vw, 640px); aspect-ratio:1; background:var(--glow-cyan); pointer-events:none;"></div>
    <div class="cory-container" style="position:relative; display:grid; gap:var(--space-5);">
      <p data-hero-el class="cory-overline" style="margin:0;">{{ t.videos }}</p>
      <h1 id="vd-title" data-hero-title style="margin:0; max-inline-size:14ch; font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-hero); line-height:var(--leading-display); letter-spacing:var(--tracking-tighter); color:var(--text-strong);">{{ c.title }}</h1>
      <p data-hero-el style="margin:0; max-inline-size:var(--measure-lead); font-size:var(--text-fluid-lead); line-height:var(--leading-relaxed); color:var(--text-body);">{{ c.lead }}</p>
      <div data-hero-el data-hero-ctas style="display:flex; gap:var(--space-3); flex-wrap:wrap;"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="primary" size="lg" href="{{ s.youtube }}" target="_blank" rel="noopener" hint-size="auto,52px">{{ c.sub }}</x-import><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="lg" href="Read.dc.html" hint-size="auto,52px">{{ c.posts }}</x-import></div>
    </div>
  </section>
  <section aria-label="{{ c.title }}" style="padding-block:0 var(--section-y);">
    <div class="cory-container" data-cq><ul data-cq-grid style="display:grid; gap:var(--space-12) var(--grid-gap);">
      <sc-for list="{{ items }}" as="v" hint-placeholder-count="4">
        <li style="display:flex; flex-direction:column; gap:var(--space-4);">
          <div data-img-reveal class="cory-on-ink" style="position:relative; aspect-ratio:var(--aspect-video); border-radius:var(--radius-xl); overflow:hidden; isolation:isolate; background:var(--gradient-ink); box-shadow:var(--shadow-lg);">
            <sc-if value="{{ v.playing }}" hint-placeholder-val="{{ false }}"><iframe src="{{ v.embed }}" title="{{ v.title }}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen="" style="position:absolute; inset:0; inline-size:100%; block-size:100%; border:0;"></iframe></sc-if>
            <sc-if value="{{ v.idle }}" hint-placeholder-val="{{ true }}">
              <sc-if value="{{ v.poster }}" hint-placeholder-val="{{ false }}"><img srcset="{{ v.ss }}" sizes="(max-width: 767px) 92vw, 50vw" src="{{ v.poster }}" alt="" loading="lazy" decoding="async" style="position:absolute; inset:0; inline-size:100%; block-size:100%; object-fit:cover; z-index:-2;"></sc-if>
              <span aria-hidden="true" style="position:absolute; inset:0; z-index:-1; background:var(--glow-cyan-strong) no-repeat 100% 0 / 70% 90%;"></span>
              <sc-if value="{{ v.poster }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute; inset:0; z-index:-1; background:var(--surface-overlay);"></span></sc-if>
              <div style="position:absolute; inset:0; display:grid; place-items:center;">
                <sc-if value="{{ v.hasId }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ v.play }}" style="display:grid; place-items:center; inline-size:72px; block-size:72px; border-radius:var(--radius-pill); border:0; background:var(--gradient-brand-deep); color:var(--text-on-brand); box-shadow:var(--shadow-brand); cursor:pointer;" data-pop><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m8 5 11 7-11 7z"></path></svg><span class="cory-visually-hidden">{{ c.play }}: {{ v.title }}</span></button></sc-if>
                <sc-if value="{{ v.soon }}" hint-placeholder-val="{{ true }}"><span style="padding:var(--space-2) var(--space-4); border-radius:var(--radius-pill); background:var(--surface-ink); border:1px solid var(--on-ink-border-strong); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--on-ink-strong);">{{ c.soon }}</span></sc-if>
              </div>
              <span aria-hidden="true" style="position:absolute; inset-inline:var(--space-6); inset-block-end:var(--space-5); font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-h2); line-height:var(--leading-snug); color:var(--on-ink-strong);">{{ v.title }}</span>
            </sc-if>

          <bdi style="font-family:var(--font-mono); font-size:var(--text-mono-sm); color:var(--text-muted);">{{ v.meta }}</bdi>
          <h2 style="margin:0; font-size:var(--text-h3); font-weight:var(--weight-extrabold); line-height:var(--leading-heading); color:var(--text-strong);">{{ v.title }}</h2>
          <p style="margin:0; font-size:var(--text-body); line-height:var(--leading-relaxed); color:var(--text-body);">{{ v.description }}</p>
          <a data-link href="{{ v.href }}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:var(--space-1); inline-size:fit-content; min-block-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-link); text-decoration:none;"><span>{{ c.watch }}</span><span class="cory-visually-hidden">{{ t.newTab }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10M7 17 17 7"></path></svg></a>
        </li>
      </sc-for>
    </ul><sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div data-empty-state style="display:grid; gap:var(--space-4); justify-items:start; padding:var(--space-8); border-radius:var(--radius-xl); background:var(--surface-card); border:1px solid var(--border-subtle); box-shadow:var(--shadow-sm);"><span aria-hidden="true" style="display:grid; place-items:center; inline-size:44px; block-size:44px; border-radius:var(--radius-md); background:var(--gradient-ink); color:var(--on-ink-strong); flex-shrink:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></span><h2 style="margin:0; font-family:var(--font-display); font-size:var(--text-h3); font-weight:var(--weight-extrabold); line-height:var(--leading-heading); letter-spacing:var(--tracking-tight); color:var(--text-strong); text-wrap:balance;">{{ c.none }}</h2><p style="margin:0; max-inline-size:var(--measure-lead); font-size:var(--text-body); line-height:var(--leading-relaxed); color:var(--text-body); text-wrap:pretty;">{{ c.noneP }}</p><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="md" href="{{ s.youtube }}" target="_blank" rel="noopener" hint-size="auto,44px">{{ c.sub }}</x-import></div></sc-if></div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,560px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { playing: '' };
  static C = { en: { title: 'Videos', lead: 'Recordings on designing AI products people trust. A video loads from YouTube only when you press play.', sub: 'Subscribe on YouTube', posts: 'Posts and articles', play: 'Play video', soon: 'Video coming soon', watch: 'Watch on YouTube', none: 'The first video is on its way', noneP: 'Subscribe on YouTube and it will reach you the day it goes live.' },
    ar: { title: 'الفيديو', lead: 'تسجيلات عن تصميم منتجات ذكاء اصطناعي يثق بها الناس. يُحمَّل الفيديو من YouTube فقط عند الضغط على تشغيل.', sub: 'اشترك على YouTube', posts: 'المنشورات والمقالات', play: 'تشغيل الفيديو', soon: 'الفيديو قريبًا', watch: 'شاهد على YouTube', none: 'الفيديو الأول في الطريق', noneP: 'اشترك على YouTube ليصلك يوم نشره.' } };
  componentDidMount() { this.off = window.AX && window.AX.on(() => this.forceUpdate()); this.mo = new MutationObserver(() => this.forceUpdate()); this.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] }); import('./motion.js').then(m => m.boot('videos')); }
  componentWillUnmount() { this.off && this.off(); this.mo && this.mo.disconnect(); }
  renderVals() {
    const AX = window.AX; if (!AX) return { c: {}, t: {}, s: {}, items: [] };
    const lang = AX.lang(), c = Component.C[lang], s = AX.data().site;
    const vids = AX.list('videos');
    return { c, t: AX.UI[lang], s, empty: !vids.length,
      items: vids.map(v => { const id = (v.youtubeId || '').trim(), playing = this.state.playing === v.id && !!id;
        return { title: AX.tx(v, 'title'), description: v.description, poster: v.poster, ss: AX.srcset(v.poster), meta: [AX.fmtDate(v.date), v.kind, v.length].filter(Boolean).join(' · '), hasId: !!id, soon: !id, playing, idle: !playing,
          embed: 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0', href: id ? 'https://www.youtube.com/watch?v=' + id : s.youtube, play: () => this.setState({ playing: v.id }) }; }) };
  }
}
</script>
