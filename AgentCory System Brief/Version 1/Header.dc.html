<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:120},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;work&quot;,&quot;cases&quot;,&quot;services&quot;,&quot;read&quot;,&quot;videos&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  async componentDidMount() {
    this.off = window.AX && window.AX.on(() => this.forceUpdate());
    this.mo = new MutationObserver(() => this.forceUpdate()); this.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'lang'] });
    this.onKey = e => { if (this.state.menuOpen && e.key === 'Escape') this.closeMenu(); };
    document.addEventListener('keydown', this.onKey);
    /* data.js holds every string; if it never arrives (blocked, offline) say so instead of showing an empty page */
    if (!window.AX) this.failT = setTimeout(() => { if (!window.AX) this.setState({ loadFail: true }); }, 8000);
    this.site = await import('../shared/site.js');
  }
  componentWillUnmount() { this.off && this.off(); this.mo && this.mo.disconnect(); document.removeEventListener('keydown', this.onKey); document.documentElement.style.overflow = ''; clearTimeout(this.failT); }
  toggleTheme = e => { const d = document.documentElement, next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; if (this.site) this.site.setTheme(next, e.currentTarget); else d.setAttribute('data-theme', next); };
  toggleLang = () => { const AX = window.AX; if (!AX) return; if (this.state.menuOpen) this.closeMenu(); AX.setLang(AX.lang() === 'ar' ? 'en' : 'ar'); };
  openMenu = () => { this.opener = document.activeElement; document.documentElement.style.overflow = 'hidden'; this.setState({ menuOpen: true }, () => setTimeout(() => { const b = document.querySelector('[data-menu-close] button') || document.querySelector('[data-menu]'); b && b.focus(); }, 60)); };
  closeMenu = () => { document.documentElement.style.overflow = ''; this.setState({ menuOpen: false }, () => this.opener && this.opener.focus && this.opener.focus()); };
  skip = e => { const m = document.getElementById('main'); if (m) { e.preventDefault(); m.focus({ preventScroll: true }); const y = m.getBoundingClientRect().top + scrollY - 72; window.scrollTo({ top: Math.max(0, y) }); } };
  renderVals() {
    const AX = window.AX, t = k => AX ? AX.t(k) : k, cur = this.props.current || '';
    const keys = [['work', 'Work.dc.html'], ['cases', 'Case Studies.dc.html'], ['services', 'Services.dc.html'], ['read', 'Read.dc.html'], ['videos', 'Videos.dc.html'], ['about', 'About.dc.html'], ['contact', 'Contact.dc.html']];
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
      t: AX ? AX.UI[AX.lang()] : {}, otherLang: AX && AX.lang() === 'ar' ? 'en' : 'ar',
      nav: keys.map(([k, href], i) => ({ label: t(k), href, n: '0' + (i + 1), current: cur === k ? 'page' : undefined })),
      themeLabel: dark ? t('light') : t('dark'), toggleTheme: this.toggleTheme, toggleLang: this.toggleLang,
      loadFail: !!this.state.loadFail, reload: () => location.reload(), menuOpen: this.state.menuOpen, openMenu: this.openMenu, closeMenu: this.closeMenu, skip: this.skip
    };
  }
}
</script>
