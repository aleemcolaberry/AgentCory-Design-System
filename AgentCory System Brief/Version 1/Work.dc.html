<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<body>

<helmet>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AIUXAleem">
  <meta property="og:title" content="Projects · AIUXAleem">
  <meta property="og:description" content="What Mohammad Abdul Aleem is building and what has shipped: design systems and AI products, each with its live site, repository and case study.">
  <meta property="og:image" content="https://aiuxaleem.com/assets/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">

  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
  <script src="data.js"></script>
</helmet>
<dc-import name="Header" current="work" hint-size="100%,72px"></dc-import>
<main id="main" tabindex="-1" style="position:relative; z-index:var(--z-raised); outline:none;">
  <section aria-labelledby="work-title" style="position:relative; overflow:clip; padding-block:var(--section-y) var(--space-10);">
    <div aria-hidden="true" class="cory-glow-drift" style="position:absolute; inset-block-start:-30%; inset-inline-end:-10%; inline-size:min(60vw, 640px); aspect-ratio:1; background:var(--glow-cyan); pointer-events:none;"></div>
    <div class="cory-container" style="position:relative; display:grid; gap:var(--space-5);">
      <p data-hero-el class="cory-overline" style="margin:0;">{{ c.over }}</p>
      <h1 id="work-title" data-hero-title style="margin:0; font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-hero); line-height:var(--leading-display); letter-spacing:var(--tracking-tighter); color:var(--text-strong);">{{ c.title }}</h1>
      <p data-hero-el style="margin:0; max-inline-size:var(--measure-lead); font-size:var(--text-fluid-lead); line-height:var(--leading-relaxed); color:var(--text-body);">{{ c.lead }}</p>
      <div data-hero-el data-hero-ctas style="display:flex; gap:var(--space-3); flex-wrap:wrap;"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="primary" size="lg" href="Case Studies.dc.html" hint-size="auto,52px">{{ c.cta }}</x-import></div>
      <div data-hero-el role="group" aria-label="{{ c.filter }}" style="display:grid; gap:var(--space-3); margin-block-start:var(--space-4);">
        <div style="display:flex; align-items:center; gap:var(--space-2) var(--space-3); flex-wrap:wrap;"><span style="min-inline-size:5em; font-size:var(--text-body-sm); color:var(--text-muted);">{{ c.topic }}</span><sc-for list="{{ topics }}" as="f" hint-placeholder-count="3"><x-import component-from-global-scope="DesignSystem_ebeb85.Chip" selected="{{ f.on }}" onClick="{{ f.toggle }}" hint-size="auto,40px">{{ f.label }}</x-import></sc-for></div>
        <div style="display:flex; align-items:center; gap:var(--space-2) var(--space-3); flex-wrap:wrap;"><span style="min-inline-size:5em; font-size:var(--text-body-sm); color:var(--text-muted);">{{ c.status }}</span><sc-for list="{{ statuses }}" as="f" hint-placeholder-count="3"><x-import component-from-global-scope="DesignSystem_ebeb85.Chip" selected="{{ f.on }}" onClick="{{ f.toggle }}" hint-size="auto,40px">{{ f.label }}</x-import></sc-for></div>
        <p role="status" style="margin:0; font-size:var(--text-body-sm); color:var(--text-muted);">{{ count }}</p>
      </div>
    </div>
  </section>
  <section aria-label="{{ c.title }}" style="padding-block:0 var(--section-y);">
    <div class="cory-container" data-cq>
      <ul data-cq-grid style="display:grid; gap:var(--grid-gap);">
        <sc-for list="{{ items }}" as="p" hint-placeholder-count="4">
          <li style="display:grid; min-inline-size:0;">
            <a href="{{ p.href }}" data-tilt style="display:flex; flex-direction:column; border-radius:var(--radius-xl); overflow:hidden; background:var(--surface-card); border:1px solid var(--border-subtle); box-shadow:var(--shadow-sm); color:inherit; text-decoration:none; transition:box-shadow var(--duration-slow) var(--ease-out);" style-hover="box-shadow:var(--shadow-lg);">
              <span data-img-reveal style="position:relative; display:block; aspect-ratio:var(--aspect-case); overflow:hidden; background:var(--gradient-ink);">
                <span data-tilt-media style="position:absolute; inset:-5%; display:block;"><sc-if value="{{ p.cover }}" hint-placeholder-val="{{ false }}"><img srcset="{{ p.ss }}" sizes="(max-width: 767px) 92vw, 50vw" src="{{ p.cover }}" alt="" loading="lazy" decoding="async" style="inline-size:100%; block-size:100%; object-fit:cover; object-position:top center;"></sc-if></span>
                <sc-if value="{{ p.noCover }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position:absolute; inset:0; display:grid; align-items:end; padding:var(--space-6); font-family:var(--font-display); font-weight:var(--weight-extrabold); font-size:var(--text-fluid-h2); line-height:var(--leading-snug); color:var(--on-ink-strong); background:var(--glow-cyan-strong) no-repeat 100% 0 / 70% 90%;">{{ p.title }}</span></sc-if>
              </span>
              <span style="flex:1; display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-6);">
                <span style="display:flex;"><x-import component-from-global-scope="DesignSystem_ebeb85.Badge" tone="{{ p.tone }}" dot="{{ true }}" hint-size="auto,24px">{{ p.status }}</x-import></span>
                <span style="font-size:var(--text-h3); font-weight:var(--weight-extrabold); line-height:var(--leading-heading); letter-spacing:var(--tracking-tight); color:var(--text-strong);">{{ p.title }}</span>
                <span style="font-size:var(--text-body); line-height:var(--leading-relaxed); color:var(--text-body);">{{ p.summary }}</span>
                <span style="display:flex; gap:var(--space-2); flex-wrap:wrap;"><sc-for list="{{ p.topics }}" as="tp" hint-placeholder-count="3"><x-import component-from-global-scope="DesignSystem_ebeb85.Badge" tone="neutral" hint-size="auto,24px">{{ tp }}</x-import></sc-for></span>
                <span style="margin-block-start:auto; display:inline-flex; align-items:center; gap:var(--space-1); min-block-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-link);"><span>{{ t.viewProject }}</span><svg data-dir-icon width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span>
              </span>
            </a>
          </li>
        </sc-for>
      </ul>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div data-empty-state style="display:grid; gap:var(--space-3); justify-items:start; padding:var(--space-8); border-radius:var(--radius-xl); background:var(--surface-card); border:1px solid var(--border-subtle);"><p style="margin:0; font-size:var(--text-h4); font-weight:var(--weight-bold); color:var(--text-strong);">{{ noneMsg }}</p><sc-if value="{{ filtered }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="md" onClick="{{ clear }}" hint-size="auto,44px">{{ c.clear }}</x-import></sc-if><sc-if value="{{ noneAtAll }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="md" href="Case Studies.dc.html" hint-size="auto,44px">{{ c.toCases }}</x-import></sc-if></div></sc-if>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,560px"></dc-import>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { topics: [], statuses: [] };
  static C = { en: { over: 'Work', title: 'Projects', lead: 'What I am building and what has shipped. Each project links to its live site, its repository and, where there is one, the full case study.', cta: 'Read the case studies', filter: 'Filter projects', topic: 'Topic', status: 'Status', none: 'No project matches both filters.', noneAll: 'Projects are being written up. The case studies show the work in depth.', clear: 'Clear filters', toCases: 'Read the case studies', count: 'Showing {n} of {t} projects' },
    ar: { over: 'الأعمال', title: 'المشاريع', lead: 'ما أبنيه الآن وما أُطلق. كل مشروع يربط بموقعه المباشر ومستودعه ودراسة الحالة الكاملة حيث توجد.', cta: 'اقرأ دراسات الحالة', filter: 'تصفية المشاريع', topic: 'الموضوع', status: 'الحالة', none: 'لا يوجد مشروع يطابق المرشّحين.', noneAll: 'أكتب المشاريع الآن. دراسات الحالة تعرض العمل بعمق.', clear: 'مسح المرشّحات', toCases: 'اقرأ دراسات الحالة', count: 'عرض {n} من {t} مشاريع' } };
  componentDidMount() { this.off = window.AX && window.AX.on(() => this.forceUpdate()); this.mo = new MutationObserver(() => this.forceUpdate()); this.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] }); import('./motion.js').then(m => m.boot('work')); }
  componentWillUnmount() { this.off && this.off(); this.mo && this.mo.disconnect(); }
  tog(key, v) { this.setState(s => ({ [key]: s[key].includes(v) ? s[key].filter(x => x !== v) : [...s[key], v] }), () => window.ScrollTrigger && window.ScrollTrigger.refresh()); }
  renderVals() {
    const AX = window.AX; if (!AX) return { c: {}, t: {}, topics: [], statuses: [], items: [] };
    const lang = AX.lang(), c = Component.C[lang], all = AX.list('projects'), s = this.state;
    const tset = [...new Set(all.flatMap(p => p.topics || []))], sset = [...new Set(all.map(p => p.status))];
    const items = all.filter(p => (!s.topics.length || s.topics.some(t => (p.topics || []).includes(t))) && (!s.statuses.length || s.statuses.includes(p.status)));
    return { c, t: AX.UI[lang],
      topics: tset.map(label => ({ label, on: s.topics.includes(label), toggle: () => this.tog('topics', label) })),
      statuses: sset.map(label => ({ label, on: s.statuses.includes(label), toggle: () => this.tog('statuses', label) })),
      count: c.count.replace('{n}', items.length).replace('{t}', all.length), empty: !items.length, noneAtAll: !all.length, filtered: !!all.length, noneMsg: all.length ? c.none : c.noneAll, clear: () => this.setState({ topics: [], statuses: [] }),
      items: items.map(p => ({ title: AX.tx(p, 'title'), summary: AX.tx(p, 'summary'), status: p.status, tone: p.status === 'Shipped' ? 'success' : p.status === 'In progress' ? 'brand' : 'neutral', topics: p.topics || [], cover: p.cover, ss: AX.srcset(p.cover), noCover: !p.cover, href: 'Project.dc.html?slug=' + p.slug })) };
  }
}
</script>
</body>
</html>
