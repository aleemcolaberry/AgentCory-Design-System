<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  static C = { en: { title: 'What I am building and learning.', lead: 'A short, current list. The finished work is in the case studies.', upd: 'Last updated {d}', cases: 'Read the case studies', about: 'About me', bOver: 'Building', bTitle: 'Work in hand', lOver: 'Learning', lTitle: 'Studying now', done: 'Completed certifications' },
    ar: { title: 'ما أبنيه وما أتعلّمه.', lead: 'قائمة قصيرة وحالية. الأعمال المنجزة في دراسات الحالة.', upd: 'آخر تحديث {d}', cases: 'اقرأ دراسات الحالة', about: 'نبذة عني', bOver: 'البناء', bTitle: 'العمل الجاري', lOver: 'التعلّم', lTitle: 'أدرس الآن', done: 'الشهادات المكتملة' } };
  componentDidMount() { this.off = window.AX && window.AX.on(() => this.forceUpdate()); this.mo = new MutationObserver(() => this.forceUpdate()); this.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] }); import('./motion.js').then(m => m.boot('now')); }
  componentWillUnmount() { this.off && this.off(); this.mo && this.mo.disconnect(); }
  renderVals() {
    const AX = window.AX; if (!AX) return { c: {}, t: {}, build: [], learning: [] };
    const lang = AX.lang(), c = Component.C[lang], n = AX.data().now;
    return { c, t: AX.UI[lang], updated: c.upd.replace('{d}', n.updated), build: n.build.map(b => ({ ...b, tone: b.status === 'Shipped' ? 'success' : b.status === 'In production' ? 'brand' : 'neutral' })), learning: n.learning };
  }
}
</script>
