ntColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></span></span></a></li></sc-for></ul><sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div data-empty-state style="display:grid; gap:var(--space-4); justify-items:start; padding:var(--space-8); border-radius:var(--radius-xl); background:var(--surface-card); border:1px solid var(--border-subtle); box-shadow:var(--shadow-sm);"><span aria-hidden="true" style="display:grid; place-items:center; inline-size:44px; block-size:44px; border-radius:var(--radius-md); background:var(--gradient-ink); color:var(--on-ink-strong); flex-shrink:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="M16 13H8M16 17H8M10 9H8"></path></svg></span><h2 style="margin:0; font-family:var(--font-display); font-size:var(--text-h3); font-weight:var(--weight-extrabold); line-height:var(--leading-heading); letter-spacing:var(--tracking-tight); color:var(--text-strong); text-wrap:balance;">{{ emptyT }}</h2><p style="margin:0; max-inline-size:var(--measure-lead); font-size:var(--text-body); line-height:var(--leading-relaxed); color:var(--text-body); text-wrap:pretty;">{{ emptyP }}</p><sc-if value="{{ tag }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="md" onClick="{{ clearTag }}" hint-size="auto,44px">{{ c.allPosts }}</x-import></sc-if><sc-if value="{{ noTag }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="DesignSystem_ebeb85.Button" variant="secondary" size="md" href="{{ s.linkedin }}" target="_blank" rel="noopener" hint-size="auto,44px">{{ c.follow }}</x-import></sc-if></div></sc-if></div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tag: (window.AX && window.AX.q('tag')) || '' };
  static C = { en: { title: 'Blog', tagged: 'Posts tagged {t}', lead: 'Guides and articles on design systems and designing AI products.', allPosts: 'All posts', topics: 'Topics', count: '{n} posts', none: 'No posts yet', noneP: 'The first guide is being written. Follow along on LinkedIn in the meantime.', follow: 'Follow on LinkedIn', noneTag: 'Nothing tagged {t} yet', noneTagP: 'Try another topic, or go back to every post.' }, ar: { title: 'المدوّنة', tagged: 'مقالات بموضوع {t}', lead: 'أدلة ومقالات عن أنظمة التصميم وتصميم منتجات الذكاء الاصطناعي.', allPosts: 'كل المقالات', topics: 'المواضيع', count: '{n} مقالات', none: 'لا توجد مقالات بعد', noneP: 'أكتب الدليل الأول الآن. تابعني على LinkedIn حتى ذلك الحين.', follow: 'تابعني على LinkedIn', noneTag: 'لا شيء بموضوع {t} بعد', noneTagP: 'جرّب موضوعًا آخر، أو عد إلى كل المقالات.' } };
  componentDidMount() { this.off = window.AX && window.AX.on(() => this.forceUpdate()); this.mo = new MutationObserver(() => this.forceUpdate()); this.mo.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] }); import('./motion.js').then(m => m.boot('blog')); }
  componentWillUnmount() { this.off && this.off(); this.mo && this.mo.disconnect(); }
  setTag(tag) { this.setState({ tag }); try { const u = new URL(location.href); if (tag) u.searchParams.set('tag', tag); else u.searchParams.delete('tag'); history.replaceState(null, '', u); } catch (e) {} }
  renderVals() {
    const AX = window.AX; if (!AX) return { c: {}, t: {}, topics: [], posts: [] };
    const lang = AX.lang(), c = Component.C[lang], all = AX.list('posts'), tag = this.state.tag, list = tag ? all.filter(p => (p.topics || []).includes(tag)) : all;
    return { c, t: AX.UI[lang], s: AX.data().site, hasTopics: all.some(p => (p.topics || []).length), tag: !!tag, noTag: !tag, empty: !list.length, emptyT: tag ? c.noneTag.replace('{t}', tag) : c.none, emptyP: tag ? c.noneTagP : c.noneP, clearTag: () => this.setTag(''), title: tag ? c.tagged.replace('{t}', tag) : c.title, count: c.count.replace('{n}', list.length),
      topics: [...new Set(all.flatMap(p => p.topics || []))].map(label => ({ label, on: tag === label, go: () => this.setTag(tag === label ? '' : label) })),
      posts: list.map(p => ({ title: AX.tx(p, 'title'), excerpt: AX.tx(p, 'excerpt'), topics: p.topics || [], meta: (p.updated ? 'Updated ' : '') + AX.fmtDate(p.date) + ' · ' + p.read, href: 'Post.dc.html?slug=' + p.slug })) };
  }
}
</script>
