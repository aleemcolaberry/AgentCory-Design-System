<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="../shared/site.css">
  <script src="../_ds/agentcory-design-system-ebeb8591-9d98-4009-838b-178d8ac72f26/_ds_bundle.js"></script>
</helmet>
<div data-card-fill data-cq style="block-size:100%;">
  <x-import component-from-global-scope="DesignSystem_ebeb85.Card" padding="md" style="block-size:100%;" hint-size="100%,360px">
    <div data-cq-pad style="display:flex; flex-direction:column; gap:var(--space-4); block-size:100%;">
      <p class="cory-overline" style="margin:0;">{{ copy.overline }}</p>
      <div style="display:flex; align-items:center; gap:var(--space-3);">
        <x-import component-from-global-scope="DesignSystem_ebeb85.Avatar" kind="image" src="../assets/media/avatar-aleem-2026.jpg" name="{{ copy.author }}" size="{{ 44 }}" hint-size="44px,44px"></x-import>
        <div style="display:grid; line-height:var(--leading-heading);">
          <strong style="font-size:var(--text-body-sm); font-weight:var(--weight-bold); color:var(--text-strong);">{{ copy.author }}</strong>
          <span style="font-size:var(--text-caption); color:var(--text-muted);">{{ copy.role }}</span>
        </div>
      </div>
      <p style="margin:0; font-size:var(--text-body); line-height:var(--leading-relaxed); color:var(--text-body);">{{ copy.body }}</p>
      <div style="margin-block-start:auto; display:flex; justify-content:space-between; align-items:center; gap:var(--space-2) var(--space-3); flex-wrap:wrap; padding-block-start:var(--space-4); border-block-start:1px solid var(--border-subtle);">
        <sc-if value="{{ hasStats }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono); font-size:var(--text-mono); color:var(--text-muted);">{{ copy.stats }}</span></sc-if>
        <a data-link href="{{ copy.href }}" target="_blank" rel="noopener" style="display:inline-flex; align-items:center; gap:var(--space-1); min-block-size:var(--tap-target); font-size:var(--text-body-sm); font-weight:var(--weight-semibold); color:var(--text-link); text-decoration:none;">{{ copy.read }}<svg data-dir-icon width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg></a>
      </div>
    </div>
  </x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:420},&quot;copy&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{overline,author,role,body,stats,read,href}&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() { const copy = this.props.copy || {}; return { copy, hasStats: !!copy.stats, level: this.props.level || 3 }; }
}
</script>
</body>
</html>
