<!-- @dsCard group="Colors" viewport="700x150" name="Signal Cyan" subtitle="Gradient end + bright accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(11,31,54,0.06); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 8px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .star .name::after { content: '★'; color: var(--cyan-600); margin-inline-start: 5px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--cyan-600)"></div><div class="name">cyan-600</div><div class="hex">#169FC0</div></div>
    <div class="sw star"><div class="chip" style="background:var(--cyan-500)"></div><div class="name">cyan-500</div><div class="hex">#29BEDD</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-400)"></div><div class="name">cyan-400</div><div class="hex">#5FD0E8</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-300)"></div><div class="name">cyan-300</div><div class="hex">#95E1F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-200)"></div><div class="name">cyan-200</div><div class="hex">#C4EEF8</div></div>
    <div class="sw"><div class="chip" style="background:var(--cyan-100)"></div><div class="name">cyan-100</div><div class="hex">#E6F8FC</div></div>
  </div>
</body>
</html>
