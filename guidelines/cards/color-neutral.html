<!-- @dsCard group="Colors" viewport="700x150" name="Neutral Slate" subtitle="Cool grays tuned to the #F4F5FA surface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { flex: 1 1 56px; min-width: 56px; }
  .chip { height: 64px; border-radius: var(--radius-sm); border: 1px solid rgba(11,31,54,0.07); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 7px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--slate-50)"></div><div class="name">slate-50</div><div class="hex">#F4F5FA</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-100)"></div><div class="name">slate-100</div><div class="hex">#ECEEF4</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-200)"></div><div class="name">slate-200</div><div class="hex">#D5D9E4</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-400)"></div><div class="name">slate-400</div><div class="hex">#939BAE</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-500)"></div><div class="name">slate-500</div><div class="hex">#6E7689</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-700)"></div><div class="name">slate-700</div><div class="hex">#3B4253</div></div>
    <div class="sw"><div class="chip" style="background:var(--slate-900)"></div><div class="name">slate-900</div><div class="hex">#151A26</div></div>
  </div>
</body>
</html>
