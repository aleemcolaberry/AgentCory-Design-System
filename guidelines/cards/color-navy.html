<!-- @dsCard group="Colors" viewport="700x150" name="Brand Navy" subtitle="Core ink: the Cory mascot color" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(11,31,54,0.06); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 8px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .star { position: relative; }
  .star .name::after { content: '★ core'; color: var(--text-link); margin-inline-start: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--navy-900)"></div><div class="name">navy-900</div><div class="hex">#06121F</div></div>
    <div class="sw star"><div class="chip" style="background:var(--navy-800)"></div><div class="name">navy-800</div><div class="hex">#0B1F36</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-700)"></div><div class="name">navy-700</div><div class="hex">#12304F</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-500)"></div><div class="name">navy-500</div><div class="hex">#2A547F</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-300)"></div><div class="name">navy-300</div><div class="hex">#8197AF</div></div>
    <div class="sw"><div class="chip" style="background:var(--navy-100)"></div><div class="name">navy-100</div><div class="hex">#DEE4EC</div></div>
  </div>
</body>
</html>
