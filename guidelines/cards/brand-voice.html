<!-- @dsCard group="Brand" viewport="700x170" name="Voice & Stat Treatment" subtitle="Cory speaks first-person; metrics lead with big numbers" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display: flex; gap: 28px; align-items: center; }
  .voice { flex: 1; }
  .pill { margin-bottom: 12px; }
  .quote { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--text-strong); letter-spacing: -0.018em; line-height: 1.3; }
  .stats { display: flex; gap: 22px; }
  .stat .num { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1; color: var(--navy-800); }
  .stat .num.g { background: var(--gradient-brand-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="voice">
    <span class="cory-eyebrow-pill pill">Hi, I'm Cory 👋</span>
    <div class="quote">"Ready to see what I can do for your admissions team?"</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="num g">10x</div><div class="lbl">ROI Potential</div></div>
    <div class="stat"><div class="num">847%</div><div class="lbl">Year-1 ROI</div></div>
  </div>
</body>
</html>
