<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .pane { display: flex; align-items: center; justify-content: center; padding: 40px; min-height: 180px; box-sizing: border-box; }
  .light { background: var(--surface-card); }
  .dark { background: var(--navy-800); }
  img { width: 200px; height: auto; }
</style>
</head>
<body>
  <div class="pane light"><img src="../../assets/logo-agentcory.svg" alt="AgentCory"></div>
  <div class="pane dark"><img src="../../assets/logo-agentcory-darkmode.svg" alt="AgentCory"></div>
</body>
</html>
