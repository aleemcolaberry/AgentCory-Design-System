<!-- @dsCard group="Colors" viewport="700x150" name="Signal Blue" subtitle="Primary action + gradient start" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .sw { flex: 1 1 56px; min-width: 56px; }
  .chip { height: 64px; border-radius: var(--radius-md); border: 1px solid rgba(11,31,54,0.06); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 8px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
  .star .name::after { content: '★'; color: var(--text-link); margin-inline-start: 5px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="name">blue-700</div><div class="hex">#1568D4</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="name">blue-600</div><div class="hex">#1B79EC</div></div>
    <div class="sw star"><div class="chip" style="background:var(--blue-500)"></div><div class="name">blue-500</div><div class="hex">#258AFD</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-400)"></div><div class="name">blue-400</div><div class="hex">#5AA7FE</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-200)"></div><div class="name">blue-200</div><div class="hex">#C2DEFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="name">blue-100</div><div class="hex">#E6F1FF</div></div>
  </div>
</body>
</html>
