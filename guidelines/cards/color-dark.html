<!-- @dsCard group="Colors" viewport="700x300" name="Dark theme" subtitle="data-theme=&quot;dark&quot; re-maps every semantic token; on-ink tokens stay constant" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 300px; }
  @media (max-width: 480px) { body { grid-template-columns: 1fr; } }
  .half { padding: 22px 24px; background: var(--surface-page); color: var(--text-body); display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-subtle); }
  .t { font-weight: 700; color: var(--text-strong); font-size: 15px; }
  .m { font-size: 13px; color: var(--text-muted); }
  .sw { display: flex; gap: 6px; margin-top: 4px; }
  .sw i { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border-default); }
  .ink { background: var(--surface-ink); color: var(--on-ink-body); border-radius: var(--radius-lg); padding: 12px 16px; font-size: 13px; }
  .ink b { color: var(--on-ink-strong); }
  a { font-size: 13px; display: inline-block; padding: 4px 0; }
</style>
</head>
<body>
  <div class="half">
    <div class="lbl">Light · default</div>
    <div class="card"><div class="t">Surface card</div><div class="m">--text-muted 6.5:1 · <a href="#">--text-link 5.3:1</a></div>
      <div class="sw"><i style="background:var(--surface-page)"></i><i style="background:var(--surface-card)"></i><i style="background:var(--surface-sunken)"></i><i style="background:var(--surface-raised)"></i><i style="background:var(--border-interactive)"></i></div></div>
    <div class="ink"><b>--surface-ink</b> · on-ink body 10.5:1</div>
  </div>
  <div class="half" data-theme="dark">
    <div class="lbl">Dark · data-theme="dark"</div>
    <div class="card"><div class="t">Surface card</div><div class="m">navy-850 on navy-900 · <a href="#">blue-400 link</a></div>
      <div class="sw"><i style="background:var(--surface-page)"></i><i style="background:var(--surface-card)"></i><i style="background:var(--surface-sunken)"></i><i style="background:var(--surface-raised)"></i><i style="background:var(--border-interactive)"></i></div></div>
    <div class="ink" style="box-shadow:var(--shadow-glow)"><b>--surface-ink</b> · black shadows + --shadow-glow</div>
  </div>
</body>
</html>
