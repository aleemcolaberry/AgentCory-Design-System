<!-- @dsCard group="Spacing" viewport="700x160" name="Radius" subtitle="Soft, generous corners: the brand signature" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 72px; background: var(--blue-100); border: 1.5px solid var(--blue-400); }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: center; }
  .lbl b { color: var(--text-strong); display: block; font-weight: 600; }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl"><b>sm</b>10px</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl"><b>md</b>14px</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl"><b>lg</b>18px</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl"><b>xl</b>24px</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lbl"><b>2xl</b>32px</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lbl"><b>pill</b>999px</div></div>
</body>
</html>
