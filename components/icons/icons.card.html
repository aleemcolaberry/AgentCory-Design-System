<!-- @dsCard group="Components" viewport="700x640" name="Icons" subtitle="The owned Cory set: 24px grid, 1.75 stroke, duotone tint, currentColor, RTL-aware" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px; background: var(--surface-card); color: var(--text-body); font-family: var(--font-sans); }
  .glabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 12px; }
  .section { margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: var(--radius-sm); color: var(--text-strong); min-width: 0; }
  .cell:hover { background: var(--surface-sunken); }
  .cell span { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); text-align: center; overflow-wrap: break-word; line-height: 1.25; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .tile { width: 48px; height: 48px; border-radius: var(--radius-md); display: inline-grid; place-items: center; }
  .sizes { display: flex; align-items: flex-end; gap: 18px; color: var(--text-strong); }
  .sizes div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .sizes span { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<div style="position:fixed;top:8px;inset-inline-end:8px;z-index:9;display:flex;gap:6px" dir="ltr">
<button id="__dir" type="button" aria-label="Toggle right-to-left" style="height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border-interactive);background:var(--surface-card);color:var(--text-strong);cursor:pointer;font:700 11px var(--font-mono)">RTL</button>
<button id="__theme" type="button" aria-label="Toggle dark theme" style="width:30px;height:30px;border-radius:999px;border:1px solid var(--border-interactive);background:var(--surface-card);color:var(--text-strong);cursor:pointer;font:600 11px var(--font-mono)">◐</button>
</div>
<script>(function(){var h=document.documentElement;document.getElementById('__theme').onclick=function(){h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark')};var d=document.getElementById('__dir');d.onclick=function(){var r=h.getAttribute('dir')==='rtl';h.setAttribute('dir',r?'ltr':'rtl');d.textContent=r?'RTL':'LTR'}})()</script>
<div id="root"></div>
<script type="text/babel">
  const { Icon, ICON_NAMES, Button, IconButton, FeatureCard } = window.DesignSystem_ebeb85;
  const names = ICON_NAMES || [];
  function Demo() {
    if (!Icon) return <p className="glabel">Bundle not compiled yet. Reload.</p>;
    return (
      <React.Fragment>
        <div className="section">
          <p className="glabel">In context · tile, control, inline, on ink</p>
          <div className="row">
            <span className="tile" style={{ background: 'var(--blue-100)', color: 'var(--blue-600)' }}><Icon name="phone-incoming" size={24} /></span>
            <span className="tile" style={{ background: 'var(--gradient-brand-deep-135)', color: '#fff' }}><Icon name="calendar-check" size={24} /></span>
            <span className="tile" style={{ background: 'var(--surface-ink)', color: 'var(--on-ink-link)' }}><Icon name="sparkles" size={24} /></span>
            <IconButton label="Mute notifications"><Icon name="bell-off" /></IconButton>
            <Button variant="secondary" size="sm" iconStart={<Icon name="download" size={16} duotone={false} strokeWidth={2} />}>Export CSV</Button>
            <Button size="sm" iconEnd={<Icon name="arrow-right" size={16} duotone={false} strokeWidth={2} />}>Book a demo</Button>
            <div className="sizes">
              <div><Icon name="message-dots" size={16} duotone={false} strokeWidth={2} /><span>16</span></div>
              <div><Icon name="message-dots" size={20} /><span>20</span></div>
              <div><Icon name="message-dots" size={24} /><span>24</span></div>
              <div><Icon name="message-dots" size={32} /><span>32</span></div>
            </div>
          </div>
        </div>
        <div className="section" style={{ marginBottom: 0 }}>
          <p className="glabel">The set · {names.length} glyphs · arrows, chevrons, send and trends mirror in RTL</p>
          <div className="grid">
            {names.map((n) => <div className="cell" key={n}><Icon name={n} size={24} /><span>{n}</span></div>)}
          </div>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
