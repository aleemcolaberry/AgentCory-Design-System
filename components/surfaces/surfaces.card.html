<!-- @dsCard group="Components" viewport="760x420" name="Surfaces: Card, MediaFrame, Tabs, Theme + Direction toggles" subtitle="Bento tiles, media with play/mute, tabs, light/dark and LTR/RTL switches" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .glabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; padding-inline-end: 92px; }
  .bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 118px; gap: 14px; }
  @media (max-width: 640px) { .bento { grid-template-columns: repeat(2, 1fr); } }
  h3 { font-size: var(--text-h4); }
  p { margin: 0; font-size: var(--text-body-sm); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../tokens/reveal.js"></script>
</head>
<body>
<div data-audit-ok="overlap" style="position:fixed;top:8px;inset-inline-end:8px;z-index:9;display:flex;gap:6px" dir="ltr">
<button id="__dir" type="button" aria-label="Toggle right-to-left" style="height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--border-interactive);background:var(--surface-card);color:var(--text-strong);cursor:pointer;font:700 11px var(--font-mono)">RTL</button>
<button id="__theme" type="button" aria-label="Toggle dark theme" style="width:30px;height:30px;border-radius:999px;border:1px solid var(--border-interactive);background:var(--surface-card);color:var(--text-strong);cursor:pointer;font:600 11px var(--font-mono)">◐</button>
</div>
<script>(function(){var h=document.documentElement;document.getElementById('__theme').onclick=function(){h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark')};var d=document.getElementById('__dir');d.onclick=function(){var r=h.getAttribute('dir')==='rtl';h.setAttribute('dir',r?'ltr':'rtl');d.textContent=r?'RTL':'LTR'}})()</script>
<div id="root"></div>
<script type="text/babel">
  const { Card, MediaFrame, Tabs, ThemeToggle, DirectionToggle, Badge } = window.DesignSystem_ebeb85;
  function Demo() {
    return (
      <React.Fragment>
        <div className="top">
          <Tabs items={[{value:'work',label:'Work',count:12},{value:'about',label:'About'},{value:'notes',label:'Notes'}]} defaultValue="work" />
          <Tabs variant="segmented" size="sm" items={[{value:'grid',label:'Grid'},{value:'list',label:'List'}]} />
          <div style={{display:'flex',gap:8}}><DirectionToggle size="sm" /><ThemeToggle size="sm" /></div>
        </div>
        <div className="bento" data-stagger="90" data-reveal-kind="scale">
          <Card interactive padding="none" style={{gridColumn:'span 2',gridRow:'span 2'}}>
            <MediaFrame alt="case-study cover" ratio="auto" radius="0" style={{height:'100%'}} overlay={<React.Fragment><Badge tone="onInk" size="sm">Case study</Badge><h3 style={{color:'#fff',marginTop:8}}>Admissions AI, redesigned</h3></React.Fragment>} />
          </Card>
          <Card variant="ink" interactive style={{gridColumn:'span 2'}}>
            <h3>Dark spotlight</h3>
            <p>On-ink text stays legible in both themes.</p>
          </Card>
          <Card interactive><div className="cory-metric" style={{fontSize:32}}>94%</div><p style={{color:'var(--text-muted)'}}>Contact rate</p></Card>
          <Card variant="brand" interactive><h3 style={{color:'#fff'}}>Hire me</h3><p>Open to 2026 roles.</p></Card>
        </div>
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
